name: Build My AI Voice Assistant APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# =====================================================================
# [사용자 수정 가능 변수 구역] 어플 이름 및 연결할 웹 앱 주소
# =====================================================================
env:
  APP_NAME: "나만의 AI 음성비서"
  TARGET_URL: "https://public-voice-task.streamlit.app/"
  PACKAGE_ID: "com.success.myvoiceassistant"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 깃허브 저장소 연결
        uses: actions/checkout@v4

      - name: 2. 자바(JDK 17) 환경 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 안드로이드 빌드 도구(SDK & Gradle) 준비
        uses: android-actions/setup-android@v3

      - name: 4. '나만의 AI 음성비서' 안드로이드 소스 코드 자동 생성
        run: |
          mkdir -p android_project/app/src/main/java/com/success/myvoiceassistant
          mkdir -p android_project/app/src/main/res/values

          # (1) settings.gradle 생성
          cat << 'EOF' > android_project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyAIVoiceAssistant"
          include ':app'
          EOF

          # (2) 프로젝트 루트 build.gradle 생성
          cat << 'EOF' > android_project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # (3) gradle.properties 생성
          cat << 'EOF' > android_project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # (4) 앱 모듈 build.gradle 생성
          cat << EOF > android_project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace '${PACKAGE_ID}'
              compileSdk 34

              defaultConfig {
                  applicationId "${PACKAGE_ID}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          # (5) AndroidManifest.xml 생성 (어플 이름: 나만의 AI 음성비서, 마이크 권한, 상단바 제거)
          cat << EOF > android_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME}"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # (6) MainActivity.kt 생성 (주소창 완벽 숨김, 쿠키 영구 유지, 마이크 및 파일 업로드 연동)
          cat << EOF > android_project/app/src/main/java/com/success/myvoiceassistant/MainActivity.kt
          package ${PACKAGE_ID}

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Message
          import android.webkit.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private val TARGET_URL = "${TARGET_URL}"
              private val AUDIO_PERMISSION_CODE = 1001
              private val FILE_CHOOSER_CODE = 1002
              
              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // 1. 스마트폰 마이크 녹음 권한 확인 및 요청
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.MODIFY_AUDIO_SETTINGS),
                          AUDIO_PERMISSION_CODE
                      )
                  }

                  // 2. 주소창이 전혀 없는 전체 화면 웹뷰 생성
                  webView = WebView(this)
                  setContentView(webView)

                  // 3. 쿠키 및 로컬 스토리지 영구 활성화 (자동 로그인 및 API 키 유지)
                  val cookieManager = CookieManager.getInstance()
                  cookieManager.setAcceptCookie(true)
                  cookieManager.setAcceptThirdPartyCookies(webView, true)

                  val settings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.databaseEnabled = true
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.allowFileAccess = true
                  settings.setSupportMultipleWindows(true)
                  
                  // 구글 OAuth 403 disallowed_useragent 차단을 피하기 위해 표준 모바일 크롬 User-Agent 적용
                  val defaultUA = settings.userAgentString
                  settings.userAgentString = defaultUA.replace("; wv", "")

                  // 4. 페이지 이동 및 쿠키 하드디스크 즉시 기록(Flush)
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          return false
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          CookieManager.getInstance().flush()
                      }
                  }

                  // 5. 마이크 실시간 녹음 권한 승인 및 파일 업로드 창 연동
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request?.let {
                              val origin = it.origin.toString()
                              if (origin.contains("streamlit.app")) {
                                  runOnUiThread {
                                      it.grant(it.resources)
                                  }
                              }
                          }
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          fileUploadCallback?.onReceiveValue(null)
                          fileUploadCallback = filePathCallback

                          val intent = Intent(Intent.ACTION_GET_CONTENT)
                          intent.addCategory(Intent.CATEGORY_OPENABLE)
                          intent.type = "audio/*"
                          startActivityForResult(Intent.createChooser(intent, "음성 파일 선택"), FILE_CHOOSER_CODE)
                          return true
                      }

                      // 새 창(구글 로그인 및 AI 스튜디오)을 앱 내부에서 주소창 없이 자연스럽게 연결
                      override fun onCreateWindow(
                          view: WebView?, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message?
                      ): Boolean {
                          val newWebView = WebView(this@MainActivity)
                          newWebView.settings.javaScriptEnabled = true
                          newWebView.settings.domStorageEnabled = true
                          newWebView.settings.userAgentString = settings.userAgentString
                          
                          newWebView.webViewClient = object : WebViewClient() {
                              override fun shouldOverrideUrlLoading(v: WebView?, req: WebResourceRequest?): Boolean {
                                  val target = req?.url.toString()
                                  if (target.contains("streamlit.app")) {
                                      webView.loadUrl(target)
                                      return true
                                  }
                                  return false
                              }
                          }
                          val transport = resultMsg?.obj as? WebView.WebViewTransport
                          transport?.webView = newWebView
                          resultMsg?.sendToTarget()
                          return true
                      }
                  }

                  // 6. 메인 웹 앱 실행
                  webView.loadUrl(TARGET_URL)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == FILE_CHOOSER_CODE) {
                      if (fileUploadCallback == null) return
                      val results: Array<Uri>? = if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          arrayOf(data.data!!)
                      } else null
                      fileUploadCallback?.onReceiveValue(results)
                      fileUploadCallback = null
                  }
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: 5. APK 설치 파일 빌드(생성) 실행
        working-directory: ./android_project
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. 완성된 '나만의 AI 음성비서.apk' 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 나만의_AI_음성비서_설치파일
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
